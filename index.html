<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Commander Life Counter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#111;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:#fff;overflow:hidden;touch-action:manipulation}
input,textarea,select{font-family:inherit;user-select:text;-webkit-user-select:text}
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));background:#111;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
#setup h1{margin:0;font-size:24px;text-align:center}
.lbl{font-size:14px;color:#bbb}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:#2a2a2a;border:2px solid #444;color:#fff;font-size:18px;padding:12px 20px;border-radius:12px;cursor:pointer}
.btn.sel{border-color:#fff;background:#3a3a3a}
.btn.go{background:#2e7d32;border-color:#2e7d32;font-weight:700;font-size:20px;padding:14px 40px}
.btn.danger{background:#7a1f1f;border-color:#a33}
.btn.small{font-size:14px;padding:8px 12px}
.btn:disabled{opacity:.45}
#names{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:480px}
#names input{background:#222;border:2px solid #444;color:#fff;border-radius:10px;padding:10px;font-size:16px;width:100%}
.psetup{display:grid;grid-template-columns:1fr 48px;grid-template-rows:auto auto;gap:6px 8px;background:#1a1a1a;padding:10px;border-radius:12px;border-left:4px solid #444;width:min(100%,210px)}
.psetup input{grid-column:1;grid-row:1}
.cmdpickbtn{text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psetup select,.psetup .cmdsel{grid-column:1;grid-row:2;width:100%;background:#222;border:2px solid #444;color:#fff;border-radius:10px;padding:8px;font-size:14px}
.ppreview{grid-column:2;grid-row:1/3;border-radius:8px;background:#222 center/cover no-repeat;min-height:44px}
#board{position:fixed;inset:0;display:grid;gap:6px;padding:6px}
.cell{container-type:size;position:relative;border-radius:16px;overflow:hidden;border:3px solid transparent}
.inner{position:absolute;left:50%;top:50%;width:100cqw;height:100cqh;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.r90 .inner{width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(90deg)}
.r270 .inner{width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(-90deg)}
.r180 .inner{transform:translate(-50%,-50%) rotate(180deg)}
.inner.has-art{background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#111}
.inner.has-art::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.48);z-index:0;pointer-events:none}
.zone{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:center;font-size:34px;font-weight:300;color:rgba(0,0,0,.45);padding:0 6%;z-index:1}
.zone.minus{left:0;justify-content:flex-start}.zone.plus{right:0;justify-content:flex-end}
.zone:active{background:rgba(255,255,255,.12)}
.life{font-size:min(38cqh,30cqw);font-weight:700;color:#111;line-height:1;pointer-events:none;position:relative;z-index:2}
.r90 .life,.r270 .life{font-size:min(38cqw,30cqh)}
.name{font-size:16px;font-weight:600;color:rgba(0,0,0,.65);pointer-events:none;z-index:2;margin-bottom:4px;position:relative;max-width:90%;text-align:center}
.delta{position:absolute;top:14%;font-size:20px;font-weight:700;color:rgba(0,0,0,.6);z-index:2;pointer-events:none;opacity:0;transition:opacity .3s}
.delta.show{opacity:1}
.inner.has-art .life{color:#fff;text-shadow:0 2px 10px #000,0 0 4px #000}
.inner.has-art .name,.inner.has-art .delta{color:#fff;text-shadow:0 1px 6px #000}
.inner.has-art .zone{color:rgba(255,255,255,.45)}
.actions{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:6px;align-items:center;width:max-content;max-width:92%}
.cmdbtn,.deckbtn{background:rgba(0,0,0,.35);border:none;color:#fff;font-weight:600;border-radius:20px;cursor:pointer}
.cmdbtn{font-size:14px;padding:7px 14px;white-space:nowrap}
.deckbtn{position:relative;z-index:3;font-size:12px;padding:4px 10px;margin:0 0 2px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inner:not(.has-art) .deckbtn{color:#111;background:rgba(0,0,0,.15)}
.dead .life{text-decoration:line-through;opacity:.5}
.lethal{position:absolute;top:8%;z-index:3;background:#000;color:#ff5252;font-weight:800;font-size:13px;padding:3px 10px;border-radius:10px;display:none}
.dead .lethal{display:block}
.cmdpanel{position:absolute;inset:0;background:rgba(15,15,15,.94);z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px;overflow:hidden}
.cmdpanel.open{display:flex}
.cmdpanel .t{font-size:12px;color:#bbb;text-align:center}
.crow{display:flex;align-items:center;gap:10px;width:100%;max-width:300px;justify-content:space-between}
.crow .src{display:flex;align-items:center;gap:6px;font-size:15px;min-width:90px}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.crow button{width:34px;height:34px;border-radius:10px;border:none;background:#333;color:#fff;font-size:22px}
.crow .v{font-size:20px;font-weight:700;width:40px;text-align:center}
.crow .v.l{color:#ff5252}
.done{margin-top:4px;background:#555;border:none;color:#fff;padding:8px 22px;border-radius:16px;font-size:15px}
#menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:44px;height:44px;border-radius:50%;background:#111;border:3px solid #fff;color:#fff;font-size:20px;cursor:pointer}
#camfab{position:fixed;left:50%;top:50%;transform:translate(-50%,-62px);z-index:10;width:40px;height:40px;border-radius:50%;background:#111;border:2px solid #fff;color:#fff;font-size:18px;cursor:pointer}
#menupanel{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;padding:20px}
#menupanel.open{display:flex}
.screen{position:fixed;inset:0;background:#111;z-index:25;display:none;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));gap:12px}
.screen.open{display:flex}
.shead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#111;padding:4px 0 8px;z-index:2}
.shead h2{margin:0;font-size:22px;flex:1}
.note{font-size:13px;color:#aaa}
.warn{color:#ffcc80;font-size:13px}
.stat{width:100%;border-collapse:collapse;font-size:15px}
.stat th,.stat td{text-align:left;padding:8px 6px;border-bottom:1px solid #2a2a2a}
.stat th{color:#aaa;font-size:12px;font-weight:600}
.matrixwrap{overflow:auto;width:100%;-webkit-overflow-scrolling:touch}
.matrix{border-collapse:collapse;font-size:11px}
.matrix th,.matrix td{border:1px solid #333;padding:5px 6px;text-align:center;white-space:nowrap}
.matrix th{background:#1a1a1a}
.matrix td.hit{background:#1e3a1e;font-weight:700}
.glist{display:flex;flex-direction:column;gap:10px;width:100%}
.gcard{background:#1a1a1a;border-radius:12px;padding:12px}
.gcard .when{color:#aaa;font-size:12px}
.gcard .winner{font-weight:700;margin:4px 0}
.gcard .vs{font-size:13px;color:#ccc}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#000}
#deckfilter,#photocaption{background:#222;border:2px solid #444;color:#fff;border-radius:10px;padding:10px;font-size:16px;width:100%}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.deckopt{background:#1a1a1a;border:2px solid #333;border-radius:12px;overflow:hidden;color:#fff;padding:0;cursor:pointer;text-align:left}
.deckopt.sel{border-color:#fff}
.deckopt .art{height:80px;background:#222 center/cover no-repeat}
.deckopt .lab{padding:8px;font-size:13px;font-weight:600}
#photoprevimg,#lightimg{width:100%;max-height:55vh;object-fit:contain;background:#000;border-radius:12px}
#lightbox{background:#000;z-index:30}
#endbody{display:flex;flex-direction:column;gap:10px}
#endbody .btn{width:100%;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#222;border:1px solid #555;padding:10px 16px;border-radius:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style></head><body>

<div id="setup">
  <h1>Commander Life Counter</h1>
  <div class="lbl">Players</div>
  <div class="row" id="pc"></div>
  <div class="lbl">Starting life</div>
  <div class="row" id="sl"></div>
  <div class="lbl">Names and commanders</div>
  <div class="row" id="names"></div>
  <button class="btn go" id="start">Start game</button>
</div>

<div id="board"></div>
<button id="menu" style="display:none" aria-label="Menu">⚙</button>
<button id="camfab" style="display:none" aria-label="Take photo">📷</button>
<div id="menupanel">
  <button class="btn" id="mreset">Reset life (same players)</button>
  <button class="btn" id="mnew">New game setup</button>
  <button class="btn" id="mend">End game</button>
  <button class="btn" id="mrec">Records</button>
  <button class="btn" id="march">Photo archive</button>
  <button class="btn" id="mphoto">Take photo</button>
  <button class="btn" id="mclose">Close</button>
</div>

<div id="endpanel" class="screen">
  <div class="shead"><button class="btn" id="endcancel">Cancel</button><h2>Who won?</h2></div>
  <div class="note">This saves the game to Records, including any photos you took.</div>
  <div id="endbody"></div>
</div>

<div id="records" class="screen">
  <div class="shead"><button class="btn" id="recback">Back</button><h2>Records</h2></div>
  <div id="recbody"></div>
</div>

<div id="archive" class="screen">
  <div class="shead"><button class="btn" id="archback">Back</button><h2>Photo archive</h2></div>
  <div id="archbody"></div>
</div>

<div id="deckpick" class="screen">
  <div class="shead"><button class="btn" id="deckback">Back</button><h2>Choose commander</h2></div>
  <input id="deckfilter" placeholder="Search commanders" autocomplete="off">
  <div id="deckgrid" class="deckgrid"></div>
</div>

<div id="photopreview" class="screen">
  <div class="shead"><button class="btn" id="photocancel">Cancel</button><h2>Save photo</h2></div>
  <img id="photoprevimg" alt="Preview">
  <input id="photocaption" placeholder="Caption (optional)" autocomplete="off">
  <button class="btn go" id="photosave">Save to archive</button>
</div>

<div id="lightbox" class="screen">
  <div class="shead"><button class="btn" id="lightclose">Close</button><h2>Photo</h2></div>
  <img id="lightimg" alt="Photo">
  <div id="lightcap" class="note"></div>
  <button class="btn danger" id="lightdel">Delete photo</button>
</div>

<input type="file" id="caminput" accept="image/*" capture="environment" hidden>
<input type="file" id="importinput" accept="application/json,.json" hidden>
<div id="toast"></div>

/* Add more commanders as {name, img}. The dropdown is sorted A–Z at display time. */
const COLORS=['#f4c430','#e5484d','#e79cf2','#5b6cf0'];
const KEY='mtg_life_v2';
const KEY_OLD='mtg_life_v1';

function getLS(){try{return window.localStorage;}catch(e){return null;}}
function getIDB(){try{return window.indexedDB||null;}catch(e){return null;}}

function uid(){
  try{if(crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function deckLabel(p){return (p&&p.commander)?p.commander:((p&&p.name)?p.name+"'s deck":'No commander');}
function shortName(n){return n?String(n).split(',')[0]:'—';}
function commandersSorted(){return COMMANDERS.slice().sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}));}
function findCommander(name){return name?COMMANDERS.find(c=>c.name===name)||null:null;}
function fmtDate(iso){
  try{return new Date(iso).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
  catch(e){return iso||'';}
}

let cfg={n:4,start:40,names:['Player 1','Player 2','Player 3','Player 4'],commanders:['','','','']};
let st=null; // {players:[{life,cmd:[]}], gameId, startedAt, ended}
let openCmd=-1;
let deltaT={},deltaV={};
let pickPlayer=-1;
let pendingPhoto=null;
let lightPhotoId=null;

function save(){
  try{
    const ls=getLS();
    if(!ls)return;
    ls.setItem(KEY,JSON.stringify({cfg,st}));
  }catch(e){}
}
function load(){
  try{
    const ls=getLS();
    if(!ls)return;
    let raw=null;
    try{raw=ls.getItem(KEY);}catch(e){}
    if(!raw){try{raw=ls.getItem(KEY_OLD);}catch(e){}}
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d&&d.cfg)cfg=d.cfg;
    if(d&&d.st)st=d.st;
    if(!cfg.commanders)cfg.commanders=['','','',''];
    while(cfg.commanders.length<4)cfg.commanders.push('');
    if(!cfg.names)cfg.names=['Player 1','Player 2','Player 3','Player 4'];
  }catch(e){}
}

/* ---- archive storage: IndexedDB, then localStorage, then memory ---- */
const mem={games:[],photos:[]};
let storeMode='mem';
let idb=null;

function idbReq(req){
  return new Promise((resolve,reject)=>{
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('idb'));
  });
}
function idbTxDone(tx){
  return new Promise((res,rej)=>{
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error||new Error('tx'));
    tx.onabort=()=>rej(tx.error||new Error('abort'));
  });
}
async function openDB(){
  const IDB=getIDB();
  if(!IDB)throw new Error('no idb');
  return new Promise((resolve,reject)=>{
    let req;
    try{req=IDB.open('mtg_cmd_archive',1);}catch(e){reject(e);return;}
    const timer=setTimeout(()=>reject(new Error('idb timeout')),4000);
    req.onerror=()=>{clearTimeout(timer);reject(req.error||new Error('idb open'));};
    req.onblocked=()=>{clearTimeout(timer);reject(new Error('idb blocked'));};
    req.onupgradeneeded=()=>{
      try{
        const db=req.result;
        if(!db.objectStoreNames.contains('games'))db.createObjectStore('games',{keyPath:'id'});
        if(!db.objectStoreNames.contains('photos')){
          const s=db.createObjectStore('photos',{keyPath:'id'});
          s.createIndex('gameId','gameId',{unique:false});
        }
      }catch(e){}
    };
    req.onsuccess=()=>{clearTimeout(timer);resolve(req.result);};
  });
}
async function initStore(){
  try{
    idb=await openDB();
    const tx=idb.transaction(['games','photos'],'readonly');
    mem.games=(await idbReq(tx.objectStore('games').getAll()))||[];
    mem.photos=(await idbReq(tx.objectStore('photos').getAll()))||[];
    storeMode='idb';
    return;
  }catch(e){idb=null;}
  try{
    const ls=getLS();
    if(ls){
      try{const g=JSON.parse(ls.getItem('mtg_archive_games')||'[]');if(Array.isArray(g))mem.games=g;}catch(e){}
      try{const p=JSON.parse(ls.getItem('mtg_archive_photos')||'[]');if(Array.isArray(p))mem.photos=p;}catch(e){}
      ls.setItem('mtg_archive_probe','1');
      try{ls.removeItem('mtg_archive_probe');}catch(e){}
      storeMode='ls';
      return;
    }
  }catch(e){}
  storeMode='mem';
}
function persistLs(){
  if(storeMode!=='ls')return;
  try{
    const ls=getLS();
    if(!ls)return;
    ls.setItem('mtg_archive_games',JSON.stringify(mem.games));
    ls.setItem('mtg_archive_photos',JSON.stringify(mem.photos));
  }catch(e){}
}
function upsertMem(arr,obj){
  const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.push(obj);
}
async function putGame(game){
  upsertMem(mem.games,game);
  if(storeMode==='idb'&&idb){
    try{const tx=idb.transaction('games','readwrite');tx.objectStore('games').put(game);await idbTxDone(tx);return;}catch(e){}
  }
  persistLs();
}
async function putPhoto(photo){
  upsertMem(mem.photos,photo);
  if(storeMode==='idb'&&idb){
    try{const tx=idb.transaction('photos','readwrite');tx.objectStore('photos').put(photo);await idbTxDone(tx);return;}catch(e){}
  }
  persistLs();
}
async function deleteGame(id){
  mem.games=mem.games.filter(g=>g.id!==id);
  mem.photos=mem.photos.filter(p=>p.gameId!==id);
  if(storeMode==='idb'&&idb){
    try{
      const tx=idb.transaction(['games','photos'],'readwrite');
      tx.objectStore('games').delete(id);
      const idx=tx.objectStore('photos').index('gameId');
      const req=idx.openCursor(IDBKeyRange.only(id));
      await new Promise((res,rej)=>{
        req.onsuccess=()=>{const c=req.result;if(c){c.delete();c.continue();}else res();};
        req.onerror=()=>rej(req.error);
      });
      await idbTxDone(tx);
      return;
    }catch(e){}
  }
  persistLs();
}
async function deletePhoto(id){
  mem.photos=mem.photos.filter(p=>p.id!==id);
  if(storeMode==='idb'&&idb){
    try{const tx=idb.transaction('photos','readwrite');tx.objectStore('photos').delete(id);await idbTxDone(tx);return;}catch(e){}
  }
  persistLs();
}
function exportArchive(){
  const data={version:1,exportedAt:new Date().toISOString(),games:mem.games,photos:mem.photos};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='commander-archive-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function importArchive(obj){
  if(!obj||!Array.isArray(obj.games)||!Array.isArray(obj.photos))throw new Error('Invalid archive file');
  for(const g of obj.games){if(g&&g.id)await putGame(g);}
  for(const p of obj.photos){if(p&&p.id)await putPhoto(p);}
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function storageNote(){
  if(storeMode==='mem')return '<div class="warn">Records are only in this session — use Export JSON to keep them.</div>';
  if(storeMode==='ls')return '<div class="note">Saved in this browser. Export JSON to back them up.</div>';
  return '<div class="note">Saved in this browser. Export JSON for a backup.</div>';
}

/* ---- setup + board ---- */
function ensureCfg(){
  if(!cfg.commanders)cfg.commanders=['','','',''];
  while(cfg.commanders.length<4)cfg.commanders.push('');
  if(!cfg.names)cfg.names=['Player 1','Player 2','Player 3','Player 4'];
}
function commanderOptions(selected){
  let h='<option value="">None (solid color)</option>';
  for(const c of commandersSorted()){
    h+=`<option value="${esc(c.name)}"${c.name===selected?' selected':''}>${esc(c.name)}</option>`;
  }
  return h;
}
function buildSetup(){
  ensureCfg();
  const pc=document.getElementById('pc');pc.innerHTML='';
  [2,3,4].forEach(n=>{
    const b=document.createElement('button');
    b.className='btn'+(cfg.n==n?' sel':'');b.textContent=n;
    b.onclick=()=>{cfg.n=n;buildSetup();};
    pc.appendChild(b);
  });
  const sl=document.getElementById('sl');sl.innerHTML='';
  [20,30,40].forEach(v=>{
    const b=document.createElement('button');
    b.className='btn'+(cfg.start==v?' sel':'');b.textContent=v;
    b.onclick=()=>{cfg.start=v;buildSetup();};
    sl.appendChild(b);
  });
  const nm=document.getElementById('names');nm.innerHTML='';
  for(let i=0;i<cfg.n;i++){
    const wrap=document.createElement('div');
    wrap.className='psetup';
    wrap.style.borderLeftColor=COLORS[i];
    const inp=document.createElement('input');
    inp.value=cfg.names[i]||('Player '+(i+1));
    inp.style.borderColor=COLORS[i];
    inp.placeholder='Player '+(i+1);
    inp.oninput=()=>{cfg.names[i]=inp.value;};
    const sel=document.createElement('button');
    sel.type='button';sel.className='cmdsel cmdpickbtn';
    sel.textContent=(cfg.commanders[i]||'None (solid color)')+'  \u25BE';
    sel.onclick=()=>{syncSetupFromDom();openDeckPick(i,true);};
    const prev=document.createElement('div');
    prev.className='ppreview';
    const setPrev=()=>{
      const c=findCommander(cfg.commanders[i]);
      prev.style.backgroundImage=c?`url(${c.img})`:'none';
      prev.style.backgroundColor=c?'#222':COLORS[i];
    };
    setPrev();
    wrap.appendChild(inp);wrap.appendChild(sel);wrap.appendChild(prev);
    nm.appendChild(wrap);
  }
}
function syncSetupFromDom(){
  const wraps=document.querySelectorAll('#names .psetup');
  wraps.forEach((w,i)=>{
    const inp=w.querySelector('input');
    if(inp)cfg.names[i]=inp.value;
  });
}
function newGame(){
  ensureCfg();
  for(let i=0;i<cfg.n;i++){
    if(!cfg.names[i]||!String(cfg.names[i]).trim())cfg.names[i]='Player '+(i+1);
  }
  st={
    players:Array.from({length:cfg.n},()=>({life:cfg.start,cmd:Array(cfg.n).fill(0)})),
    gameId:uid(),
    startedAt:new Date().toISOString(),
    ended:false
  };
  save();
}
function layout(n){
  if(n==2)return{cols:'1fr',rows:'1fr 1fr',cells:[{r:'r180',area:'1/1'},{r:'',area:'2/1'}]};
  if(n==3)return{cols:'1fr 1fr',rows:'1fr 1.4fr',cells:[{r:'r180',area:'1/1/2/3'},{r:'r90',area:'2/1'},{r:'r270',area:'2/2'}]};
  return{cols:'1fr 1fr',rows:'1fr 1fr',cells:[{r:'r90',area:'1/1'},{r:'r270',area:'1/2'},{r:'r90',area:'2/1'},{r:'r270',area:'2/2'}]};
}
function changeLife(i,d){
  st.players[i].life+=d;
  deltaV[i]=(deltaV[i]||0)+d;
  clearTimeout(deltaT[i]);
  deltaT[i]=setTimeout(()=>{deltaV[i]=0;render();},1500);
  save();render();
}
function changeCmd(target,src,d){
  const p=st.players[target];
  const nv=Math.max(0,p.cmd[src]+d);
  const real=nv-p.cmd[src];
  if(!real)return;
  p.cmd[src]=nv;
  changeLife(target,-real);
}
function isDead(p){return p.life<=0||p.cmd.some(c=>c>=21);}
function holdable(el,fn){
  let t,iv,held=false;
  const start=e=>{e.preventDefault();held=false;t=setTimeout(()=>{held=true;fn(10);iv=setInterval(()=>fn(10),600);},450);};
  const end=e=>{e.preventDefault();clearTimeout(t);clearInterval(iv);if(!held)fn(1);};
  el.addEventListener('pointerdown',start,{passive:false});
  el.addEventListener('pointerup',end,{passive:false});
  el.addEventListener('pointerleave',()=>{clearTimeout(t);clearInterval(iv);});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function render(){
  const b=document.getElementById('board');
  const L=layout(cfg.n);
  b.style.gridTemplateColumns=L.cols;
  b.style.gridTemplateRows=L.rows;
  b.innerHTML='';
  L.cells.forEach((c,i)=>{
    const p=st.players[i];
    const cell=document.createElement('div');
    cell.className='cell '+c.r+(isDead(p)?' dead':'');
    cell.style.gridArea=c.area;
    cell.style.borderColor=COLORS[i];
    cell.style.background=COLORS[i];
    const inner=document.createElement('div');
    inner.className='inner';
    const cmdName=cfg.commanders[i]||'';
    const art=findCommander(cmdName);
    if(art){
      inner.classList.add('has-art');
      inner.style.backgroundImage=`url(${art.img})`;
    }
    const deckLab=cmdName?shortName(cmdName):'Set commander';
    inner.innerHTML=`<div class="lethal">${p.life<=0?'OUT':'21 COMMANDER DMG'}</div>
      <div class="zone minus">−</div><div class="zone plus">+</div>
      <div class="delta ${deltaV[i]?'show':''}">${deltaV[i]>0?'+':''}${deltaV[i]||''}</div>
      <div class="name">${esc(cfg.names[i])}</div>
      <button class="deckbtn">${esc(deckLab)}</button>
      <div class="life">${p.life}</div>
      <div class="actions"><button class="cmdbtn">⚔ Commander dmg</button></div>`;
    holdable(inner.querySelector('.minus'),k=>changeLife(i,-k));
    holdable(inner.querySelector('.plus'),k=>changeLife(i,k));
    inner.querySelector('.cmdbtn').onclick=()=>{openCmd=i;render();};
    inner.querySelector('.deckbtn').onclick=()=>openDeckPick(i);
    const pan=document.createElement('div');
    pan.className='cmdpanel'+(openCmd==i?' open':'');
    let h=`<div class="t">Commander damage taken by ${esc(cfg.names[i])}</div>`;
    for(let s=0;s<cfg.n;s++){
      if(s==i)continue;
      const srcCmd=cfg.commanders[s]?` (${esc(shortName(cfg.commanders[s]))})`:'';
      h+=`<div class="crow"><div class="src"><span class="dot" style="background:${COLORS[s]}"></span>${esc(cfg.names[s])}${srcCmd}</div>
      <button data-s="${s}" data-d="-1">−</button><div class="v ${p.cmd[s]>=21?'l':''}">${p.cmd[s]}</div><button data-s="${s}" data-d="1">+</button></div>`;
    }
    h+=`<button class="done">Done</button>`;
    pan.innerHTML=h;
    pan.querySelectorAll('button[data-s]').forEach(bt=>bt.onclick=()=>changeCmd(i,+bt.dataset.s,+bt.dataset.d));
    pan.querySelector('.done').onclick=()=>{openCmd=-1;render();};
    inner.appendChild(pan);
    cell.appendChild(inner);
    b.appendChild(cell);
  });
}

function setBoardChrome(on){
  document.getElementById('menu').style.display=on?'block':'none';
  document.getElementById('camfab').style.display=on?'block':'none';
}
function showBoard(){
  document.getElementById('setup').style.display='none';
  setBoardChrome(true);
  render();
}
function showSetup(){
  closeScreens();
  document.getElementById('menupanel').classList.remove('open');
  setBoardChrome(false);
  document.getElementById('setup').style.display='flex';
  buildSetup();
}
function closeScreens(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('open'));
  const onBoard=document.getElementById('setup').style.display==='none'&&st;
  setBoardChrome(!!onBoard);
}
function openScreen(id){
  document.getElementById('menupanel').classList.remove('open');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('open'));
  document.getElementById(id).classList.add('open');

}
function unsavedWarn(){
  if(st&&!st.ended)return confirm("This game hasn't been saved to Records. Continue without saving?");
  return true;
}

function currentPlayersSnap(){
  return Array.from({length:cfg.n},(_,i)=>({name:cfg.names[i]||('Player '+(i+1)),commander:cfg.commanders[i]||''}));
}

function openEndGame(){
  if(!st)return;
  if(st.ended){toast('This game is already saved to Records.');return;}
  const body=document.getElementById('endbody');
  body.innerHTML='';
  for(let i=0;i<cfg.n;i++){
    const b=document.createElement('button');
    b.className='btn';
    const cmd=cfg.commanders[i]?` — ${cfg.commanders[i]}`:'';
    b.textContent=`${cfg.names[i]||('Player '+(i+1))}${cmd}  (${st.players[i].life} life)`;
    b.onclick=async()=>{
      await finishGame(i);
      closeScreens();
      toast('Game saved to Records');
    };
    body.appendChild(b);
  }
  openScreen('endpanel');
}
async function finishGame(winnerIndex){
  if(!st||st.ended)return;
  const game={
    id:st.gameId,
    date:new Date().toISOString(),
    startedAt:st.startedAt,
    players:st.players.map((p,i)=>({
      name:cfg.names[i]||('Player '+(i+1)),
      commander:cfg.commanders[i]||'',
      finalLife:p.life
    })),
    winner:winnerIndex
  };
  await putGame(game);
  st.ended=true;
  save();
}

function recordsStats(){
  const games=mem.games.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const stats={};
  const matrix={};
  const decks=new Set();
  for(const g of games){
    const parts=(g.players||[]).map(p=>({...p,deck:deckLabel(p)}));
    const unique=[...new Set(parts.map(p=>p.deck))];
    unique.forEach(d=>{
      decks.add(d);
      if(!stats[d])stats[d]={wins:0,games:0};
      stats[d].games++;
    });
    const w=parts[g.winner];
    if(!w)continue;
    const wd=w.deck;
    if(!stats[wd])stats[wd]={wins:0,games:0};
    stats[wd].wins++;
    for(const d of unique){
      if(d===wd)continue;
      if(!matrix[wd])matrix[wd]={};
      matrix[wd][d]=(matrix[wd][d]||0)+1;
    }
  }
  return {games,stats,matrix,decks:[...decks].sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'}))};
}
function renderRecords(){
  const {games,stats,matrix,decks}=recordsStats();
  const body=document.getElementById('recbody');
  let h=storageNote();
  h+='<div class="row" style="justify-content:flex-start"><button class="btn small" id="btnexport">Export JSON</button><button class="btn small" id="btnimport">Import JSON</button></div>';
  if(!decks.length){
    h+='<div class="note">No games recorded yet. End a game from the gear menu to start the tally.</div>';
  }else{
    h+='<h3 style="margin:8px 0 0">Decks</h3><table class="stat"><tr><th>Deck</th><th>Wins</th><th>Games</th><th>Win %</th></tr>';
    const rows=decks.slice().sort((a,b)=>(stats[b].wins-stats[a].wins)||(stats[b].games-stats[a].games)||a.localeCompare(b));
    for(const d of rows){
      const s=stats[d];
      const pct=s.games?Math.round(s.wins*1000/s.games)/10:0;
      h+=`<tr><td>${esc(d)}</td><td>${s.wins}</td><td>${s.games}</td><td>${pct}%</td></tr>`;
    }
    h+='</table><h3 style="margin:16px 0 6px">Deck vs deck</h3><div class="note">A win counts against every other deck in that game.</div>';
    h+='<div class="matrixwrap"><table class="matrix"><tr><th>Winner \\ vs</th>';
    for(const d of decks)h+=`<th>${esc(shortName(d))}</th>`;
    h+='</tr>';
    for(const a of decks){
      h+=`<tr><th>${esc(shortName(a))}</th>`;
      for(const b of decks){
        if(a===b){h+='<td>—</td>';continue;}
        const n=(matrix[a]&&matrix[a][b])||0;
        h+=`<td${n?' class="hit"':''}>${n||''}</td>`;
      }
      h+='</tr>';
    }
    h+='</table></div>';
  }
  h+='<h3 style="margin:16px 0 6px">Past games</h3>';
  if(!games.length)h+='<div class="note">None yet.</div>';
  else{
    h+='<div class="glist">';
    for(const g of games){
      const w=(g.players||[])[g.winner];
      const wlab=w?`${w.name}${w.commander?' — '+w.commander:''}`:'Unknown';
      const vs=(g.players||[]).map((p,i)=>{
        const mark=i===g.winner?' (won)':'';
        return `${p.name}${p.commander?' — '+shortName(p.commander):''} (${p.finalLife} life)${mark}`;
      }).join(' · ');
      const nPhotos=mem.photos.filter(p=>p.gameId===g.id).length;
      h+=`<div class="gcard"><div class="when">${esc(fmtDate(g.date))}${nPhotos?` · ${nPhotos} photo${nPhotos===1?'':'s'}`:''}</div>
        <div class="winner">${esc(wlab)} won</div>
        <div class="vs">${esc(vs)}</div>
        <button class="btn small danger" data-delgame="${esc(g.id)}" style="margin-top:8px">Delete</button></div>`;
    }
    h+='</div>';
  }
  body.innerHTML=h;
  body.querySelector('#btnexport').onclick=()=>exportArchive();
  body.querySelector('#btnimport').onclick=()=>document.getElementById('importinput').click();
  body.querySelectorAll('[data-delgame]').forEach(bt=>{
    bt.onclick=async()=>{
      if(!confirm('Delete this game from records? Its photos will be deleted too.'))return;
      await deleteGame(bt.getAttribute('data-delgame'));
      renderRecords();
      toast('Game deleted');
    };
  });
}
function openRecords(){renderRecords();openScreen('records');}

function photosFor(gameId){return mem.photos.filter(p=>p.gameId===gameId).sort((a,b)=>(a.date||'').localeCompare(b.date||''));}
function renderArchive(){
  const body=document.getElementById('archbody');
  let h=storageNote();
  const ended=new Map(mem.games.map(g=>[g.id,g]));
  const gameIds=[];
  const seen=new Set();
  const add=id=>{if(id&&!seen.has(id)){seen.add(id);gameIds.push(id);}};
  mem.games.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(g=>add(g.id));
  mem.photos.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(p=>add(p.gameId));
  if(st&&st.gameId)add(st.gameId);
  const withPhotos=gameIds.filter(id=>photosFor(id).length);
  if(!withPhotos.length){
    h+='<div class="note">No photos yet. Tap the camera during a game to save a moment.</div>';
    body.innerHTML=h;
    return;
  }
  h+='<div class="glist">';
  for(const id of withPhotos){
    const g=ended.get(id);
    const photos=photosFor(id);
    const first=photos[0];
    let title,when,sub;
    if(g){
      const w=(g.players||[])[g.winner];
      title=w?`${w.name} won`:'Recorded game';
      when=fmtDate(g.date);
      sub=(g.players||[]).map(p=>`${p.name}${p.commander?' — '+shortName(p.commander):''}`).join(' · ');
    }else if(st&&st.gameId===id){
      title='Current game';
      when=fmtDate(st.startedAt||first.date);
      sub=currentPlayersSnap().map(p=>`${p.name}${p.commander?' — '+shortName(p.commander):''}`).join(' · ');
    }else{
      title='Unsaved game';
      when=fmtDate(first.date);
      const snap=first.players||[];
      sub=snap.length?snap.map(p=>`${p.name}${p.commander?' — '+shortName(p.commander):''}`).join(' · '):'';
    }
    h+=`<div class="gcard"><div class="when">${esc(when)}</div><div class="winner">${esc(title)}</div>`;
    if(sub)h+=`<div class="vs">${esc(sub)}</div>`;
    h+='<div class="thumbs">';
    for(const ph of photos){
      h+=`<img src="${ph.data}" alt="${esc(ph.caption||'Photo')}" data-photoid="${esc(ph.id)}">`;
    }
    h+='</div></div>';
  }
  h+='</div>';
  body.innerHTML=h;
  body.querySelectorAll('[data-photoid]').forEach(img=>{
    img.onclick=()=>openLightbox(img.getAttribute('data-photoid'));
  });
}
function openArchive(){renderArchive();openScreen('archive');}

function openLightbox(id){
  const ph=mem.photos.find(p=>p.id===id);
  if(!ph)return;
  lightPhotoId=id;
  document.getElementById('lightimg').src=ph.data;
  document.getElementById('lightcap').textContent=ph.caption||'';
  openScreen('lightbox');
}

let pickFromSetup=false;
function normQ(t){return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}
function openDeckPick(i,fromSetup){
  pickPlayer=i;pickFromSetup=!!fromSetup;
  document.getElementById('deckfilter').value='';
  renderDeckGrid();
  openScreen('deckpick');
  try{document.getElementById('deckfilter').focus();}catch(e){}
}
function renderDeckGrid(){
  const q=normQ(document.getElementById('deckfilter').value);
  const grid=document.getElementById('deckgrid');
  const cur=cfg.commanders[pickPlayer]||'';
  let list=[{name:'',img:'',lab:'None (solid color)'}].concat(commandersSorted().map(c=>({name:c.name,img:c.img,lab:c.name})));
  if(q)list=list.filter(c=>normQ(c.lab).includes(q)||normQ(c.lab).replace(/ /g,'').includes(q.replace(/ /g,'')));
  if(!list.length)grid.innerHTML='<div style="opacity:.7;padding:12px">No commanders match.</div>';
  if(list.length)grid.innerHTML='';
  for(const c of list){
    const b=document.createElement('button');
    b.className='deckopt'+(c.name===cur?' sel':'');
    const art=c.img?`style="background-image:url(${c.img})"`:`style="background:${COLORS[pickPlayer]||'#333'}"`;
    b.innerHTML=`<div class="art" ${art}></div><div class="lab">${esc(c.lab)}</div>`;
    b.onclick=()=>{
      cfg.commanders[pickPlayer]=c.name;
      save();
      closeScreens();
      if(pickFromSetup){pickFromSetup=false;buildSetup();}else render();
    };
    grid.appendChild(b);
  }
}

async function resizeImage(file,max=1280,quality=0.72){
  let w,h,draw;
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    w=bmp.width;h=bmp.height;draw=bmp;
  }catch(e){
    draw=await new Promise((res,rej)=>{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=()=>{URL.revokeObjectURL(url);res(img);};
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
      img.src=url;
    });
    w=draw.naturalWidth||draw.width;
    h=draw.naturalHeight||draw.height;
  }
  if(w>max||h>max){
    if(w>=h){h=Math.round(h*max/w);w=max;}
    else{w=Math.round(w*max/h);h=max;}
  }
  const c=document.createElement('canvas');
  c.width=w;c.height=h;
  c.getContext('2d').drawImage(draw,0,0,w,h);
  try{if(draw.close)draw.close();}catch(e){}
  return c.toDataURL('image/jpeg',quality);
}
function openCamera(){
  if(!st){toast('Start a game first.');return;}
  document.getElementById('menupanel').classList.remove('open');
  document.getElementById('caminput').click();
}

function wireEvents(){
  document.getElementById('start').onclick=()=>{
    syncSetupFromDom();
    newGame();
    showBoard();
  };
  document.getElementById('menu').onclick=()=>document.getElementById('menupanel').classList.add('open');
  document.getElementById('mclose').onclick=()=>document.getElementById('menupanel').classList.remove('open');
  document.getElementById('mreset').onclick=()=>{
    if(!unsavedWarn())return;
    if(!confirm('Reset all life totals?'))return;
    newGame();
    openCmd=-1;
    document.getElementById('menupanel').classList.remove('open');
    render();
  };
  document.getElementById('mnew').onclick=()=>{
    if(!unsavedWarn())return;
    showSetup();
  };
  document.getElementById('mend').onclick=()=>{
    document.getElementById('menupanel').classList.remove('open');
    openEndGame();
  };
  document.getElementById('mrec').onclick=()=>openRecords();
  document.getElementById('march').onclick=()=>openArchive();
  document.getElementById('mphoto').onclick=()=>openCamera();
  document.getElementById('camfab').onclick=()=>openCamera();
  document.getElementById('endcancel').onclick=()=>closeScreens();
  document.getElementById('recback').onclick=()=>closeScreens();
  document.getElementById('archback').onclick=()=>closeScreens();
  document.getElementById('deckback').onclick=()=>closeScreens();
  document.getElementById('deckfilter').oninput=()=>renderDeckGrid();
  document.getElementById('photocancel').onclick=()=>{pendingPhoto=null;closeScreens();};
  document.getElementById('photosave').onclick=async()=>{
    if(!pendingPhoto||!st){closeScreens();return;}
    const photo={
      id:uid(),
      gameId:st.gameId,
      date:new Date().toISOString(),
      caption:(document.getElementById('photocaption').value||'').trim(),
      data:pendingPhoto,
      players:currentPlayersSnap()
    };
    await putPhoto(photo);
    pendingPhoto=null;
    closeScreens();
    toast('Photo saved to archive');
  };
  document.getElementById('lightclose').onclick=()=>{lightPhotoId=null;openArchive();};
  document.getElementById('lightdel').onclick=async()=>{
    if(!lightPhotoId)return;
    if(!confirm('Delete this photo?'))return;
    await deletePhoto(lightPhotoId);
    lightPhotoId=null;
    toast('Photo deleted');
    openArchive();
  };
  document.getElementById('caminput').onchange=async e=>{
    const f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!f||!st)return;
    try{
      pendingPhoto=await resizeImage(f);
      document.getElementById('photoprevimg').src=pendingPhoto;
      document.getElementById('photocaption').value='';
      openScreen('photopreview');
    }catch(err){
      alert('Could not read that photo.');
    }
  };
  document.getElementById('importinput').onchange=async e=>{
    const f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!f)return;
    try{
      const obj=JSON.parse(await f.text());
      if(!confirm('Import and merge this archive into your records and photos?'))return;
      await importArchive(obj);
      toast('Archive imported');
      if(document.getElementById('records').classList.contains('open'))renderRecords();
      if(document.getElementById('archive').classList.contains('open'))renderArchive();
    }catch(err){
      alert('Could not import that file. Make sure it is an archive export from this page.');
    }
  };
}

load();
buildSetup();
wireEvents();
if(st&&st.players&&st.players.length==cfg.n)showBoard();
initStore().catch(()=>{});

</script></body></html>
