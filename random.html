<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Draw a random rare or mythic Magic card, filtered by type, mana cost, and color.">
<title>Random Rare</title>
<style>
:root{
  --bg:#1c1812;
  --bg-2:#241e17;
  --surface:#2e271e;
  --surface-2:#3a3126;
  --border:#534737;
  --text:#f3ead8;
  --muted:#b8a894;
  --gold:#e8b04a;
  --gold-dim:#c4892a;
  --shadow:0 10px 28px rgba(0,0,0,.45);
  --w:#f0e6c0; --w-ink:#2a2414;
  --u:#0e68ab; --u-ink:#fff;
  --b:#2a2622; --b-ink:#e8e0d4;
  --r:#c42b24; --r-ink:#fff;
  --g:#0d7a42; --g-ink:#fff;
  --c:#b4aba6; --c-ink:#1c1812;
  --safe-t:max(12px,env(safe-area-inset-top));
  --safe-b:max(12px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{
  margin:0;min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
}
body{
  background:
    radial-gradient(1200px 500px at 50% -80px, rgba(232,176,74,.14), transparent 60%),
    var(--bg);
  padding:var(--safe-t) 14px calc(84px + var(--safe-b));
}
button,a{font-family:inherit}
button{touch-action:manipulation}

.wrap{max-width:430px;margin:0 auto}

header{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin:2px 0 10px;
}
h1{margin:0;font-size:1.25rem;font-weight:750;letter-spacing:-.02em}
header a{
  color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:600;
  border-bottom:1px solid transparent;
}
header a:hover{color:var(--gold);border-bottom-color:var(--gold)}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px;
  margin-bottom:10px;
}

.lbl{
  display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px;
}
.lbl.sp{margin-top:10px}

.seg{display:flex;gap:6px;background:var(--bg-2);padding:4px;border-radius:12px}
.seg button{
  flex:1;border:0;background:transparent;color:var(--muted);
  font-size:.8rem;font-weight:650;padding:8px 4px;border-radius:9px;cursor:pointer;white-space:nowrap;
}
.seg button[aria-pressed="true"]{
  background:var(--surface-2);color:var(--text);
  box-shadow:0 1px 0 rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.25);
}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border);
  background:var(--bg-2);
  color:var(--muted);
  font-size:.75rem;font-weight:650;
  padding:6px 9px;border-radius:999px;cursor:pointer;
}
.chip[aria-pressed="true"]{
  background:var(--surface-2);color:var(--text);
  border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold);
}
.mvchips{display:flex;gap:5px;margin:0}
.mvchips .chip{
  flex:1;text-align:center;padding:6px 0;min-width:0;font-variant-numeric:tabular-nums;
}

.toggle{
  border:1px solid var(--border);
  background:var(--bg-2);
  color:var(--muted);
  font-size:.8rem;font-weight:700;
  padding:8px 12px;border-radius:12px;cursor:pointer;
}
.toggle[aria-pressed="true"]{
  background:var(--surface-2);color:var(--text);
  border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold);
}

.colors{display:flex;justify-content:space-between;gap:8px;margin:2px 0 10px}
.pip{
  width:44px;height:44px;border-radius:50%;border:3px solid transparent;
  font-size:1.05rem;font-weight:800;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.pip[data-color="W"]{background:var(--w);color:var(--w-ink)}
.pip[data-color="U"]{background:var(--u);color:var(--u-ink)}
.pip[data-color="B"]{background:var(--b);color:var(--b-ink);box-shadow:inset 0 0 0 1px #5a5248,0 2px 0 rgba(0,0,0,.25)}
.pip[data-color="R"]{background:var(--r);color:var(--r-ink)}
.pip[data-color="G"]{background:var(--g);color:var(--g-ink)}
.pip[data-color="C"]{background:var(--c);color:var(--c-ink)}
.pip[aria-pressed="true"]{
  border-color:#fff;
  box-shadow:0 0 0 3px var(--gold),0 2px 0 rgba(0,0,0,.25);
  transform:scale(1.06);
}
.hint{margin:6px 0 0;font-size:.72rem;color:var(--muted);line-height:1.35}

.typefield{
  width:100%;
  background:var(--bg-2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:12px;
  padding:9px 12px;
  font-size:16px; /* avoid iOS zoom */
  font-family:inherit;
}
.typefield:focus{outline:none;border-color:var(--gold)}
.typefield::placeholder{color:var(--muted);opacity:.85}

.drawbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px 16px var(--safe-b);
  background:linear-gradient(to top, var(--bg) 70%, transparent);
}
.drawrow{
  display:flex;gap:8px;width:100%;max-width:430px;margin:0 auto;
}
.draw{
  flex:1;display:block;width:auto;margin:0;
  background:linear-gradient(#f0c15c,#d89a28);
  color:#2a1f0c;border:0;border-radius:16px;
  font-size:1.05rem;font-weight:800;letter-spacing:.01em;
  padding:15px 10px;cursor:pointer;
  box-shadow:0 8px 20px rgba(216,154,40,.35);
}
.draw-ten{
  background:linear-gradient(#3a3126,#2a241c);
  color:var(--gold);
  box-shadow:0 8px 16px rgba(0,0,0,.28);
  border:2px solid var(--gold);
}
.draw:active{transform:translateY(1px)}
.draw:disabled{opacity:.55;cursor:wait}

.batch-total{
  width:min(100%,372px);margin:0 auto 18px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;text-align:center;
}
.batch-total .amt{font-size:1.15rem;font-weight:800;color:var(--gold)}
.batch-total .note{display:block;margin-top:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
.batch-list{display:flex;flex-direction:column;align-items:center;gap:40px;}
.card-item{width:100%;display:flex;flex-direction:column;align-items:center;}

.status{
  text-align:center;color:var(--muted);font-size:.88rem;min-height:1.2em;
  margin:0 0 8px;pointer-events:none;
}
.status.error{color:#f0b4a0}
.status.empty{color:var(--gold)}

.stage{display:flex;flex-direction:column;align-items:center}
.cardframe{
  position:relative;width:min(100%,372px);
  aspect-ratio:5/7;
  border-radius:4.75% / 3.4%;
  background:var(--surface);
  box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;
}
.cardframe img.art{
  width:100%;height:100%;object-fit:cover;display:block;
  background:#1a1510;
}
.cardframe.loading::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg, transparent 30%, rgba(243,234,216,.08) 50%, transparent 70%);
  animation:shine 1.2s ease-in-out infinite;
}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.flip{
  display:none;
  width:min(100%,372px);
  margin:10px 0 0;
  border:1px solid var(--border);
  border-radius:12px;cursor:pointer;
  background:var(--surface-2);color:var(--text);
  font-weight:700;font-size:.9rem;padding:10px 12px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.flip.show{display:block}

.meta{width:min(100%,372px);margin-top:12px}
.name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.name{font-size:1.22rem;font-weight:750;line-height:1.2;margin:0}
.mana{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;flex-shrink:0;margin-top:3px}
.mana img{width:22px;height:22px;display:block}
.type{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.sub{margin:6px 0 0;font-size:.82rem;color:var(--muted)}
.sub .mythic{color:#f07828;font-weight:700}
.sub .rare{color:var(--gold);font-weight:700}
.sub .uncommon{color:#c5d0dc;font-weight:700}
.scry,.ckbuy{
  display:inline-block;margin-top:8px;color:var(--gold);
  font-weight:650;font-size:.9rem;text-decoration:none;
}
.scry:hover,.ckbuy:hover{text-decoration:underline}
.buylinks{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}

.price-row{
  margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;
}
.ck-amt{font-size:1.2rem;font-weight:800;color:var(--gold);letter-spacing:-.01em}
.ck-foil{font-size:.92rem;font-weight:700;color:#e8d3a0}
.ck-note{font-size:.72rem;color:var(--muted);font-weight:600}
.ck-none{font-size:.85rem;color:var(--muted);font-weight:600}
.tcg-price{margin:4px 0 0;font-size:.8rem;color:var(--muted)}

.thumb-price{display:block;font-size:.62rem;font-weight:700;color:var(--gold);padding:2px 0 3px;text-align:center}

.empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:28px;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.45;
  background:var(--surface);
}
.empty span{max-width:18em}
.empty strong{color:var(--text)}

.history{margin-top:22px}
.thumbs{
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:2px 2px 10px;scrollbar-width:thin;
}
.thumbs button{
  flex:0 0 auto;width:64px;padding:0;border:2px solid transparent;
  border-radius:8px;background:var(--surface);overflow:hidden;cursor:pointer;
}
.thumbs button[aria-current="true"]{border-color:var(--gold)}
.thumbs img{display:block;width:64px;height:89px;object-fit:cover}

footer{
  margin:22px 0 8px;text-align:center;color:var(--muted);
  font-size:.72rem;line-height:1.4;
}
footer a{color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Random Rare</h1>
      <a href="./">Life Counter</a>
    </header>

    <section class="panel" aria-label="Filters">
      <button type="button" class="toggle" id="legendary" aria-pressed="false">Legendary only</button>

      <span class="lbl sp">Type</span>
      <div class="chips" id="types" role="group" aria-label="Card type">
        <button type="button" class="chip" data-type="creature" aria-pressed="false">Creature</button>
        <button type="button" class="chip" data-type="instant" aria-pressed="false">Instant</button>
        <button type="button" class="chip" data-type="sorcery" aria-pressed="false">Sorcery</button>
        <button type="button" class="chip" data-type="enchantment" aria-pressed="false">Enchantment</button>
        <button type="button" class="chip" data-type="artifact" aria-pressed="false">Artifact</button>
        <button type="button" class="chip" data-type="planeswalker" aria-pressed="false">Planeswalker</button>
        <button type="button" class="chip" data-type="land" aria-pressed="false">Land</button>
        <button type="button" class="chip" data-type="battle" aria-pressed="false">Battle</button>
      </div>

      <div id="sub-enchantment" hidden>
        <span class="lbl sp">Enchantment type</span>
        <div class="chips" id="subtypes-enchantment" role="group" aria-label="Enchantment subtype">
          <button type="button" class="chip" data-subtype="aura" aria-pressed="false">Aura</button>
          <button type="button" class="chip" data-subtype="saga" aria-pressed="false">Saga</button>
          <button type="button" class="chip" data-subtype="class" aria-pressed="false">Class</button>
          <button type="button" class="chip" data-subtype="shrine" aria-pressed="false">Shrine</button>
          <button type="button" class="chip" data-subtype="background" aria-pressed="false">Background</button>
          <button type="button" class="chip" data-subtype="room" aria-pressed="false">Room</button>
          <button type="button" class="chip" data-subtype="case" aria-pressed="false">Case</button>
        </div>
      </div>
      <div id="sub-artifact" hidden>
        <span class="lbl sp">Artifact type</span>
        <div class="chips" id="subtypes-artifact" role="group" aria-label="Artifact subtype">
          <button type="button" class="chip" data-subtype="equipment" aria-pressed="false">Equipment</button>
          <button type="button" class="chip" data-subtype="vehicle" aria-pressed="false">Vehicle</button>
        </div>
      </div>
      <div id="sub-creature" hidden>
        <span class="lbl sp">Creature type</span>
        <input class="typefield" id="creature-type" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Dragon, Elf, Time Lord…">
      </div>

      <span class="lbl sp">Mana value</span>
      <div class="mvchips" id="mvs" role="group" aria-label="Mana value">
        <button type="button" class="chip" data-mv="0" aria-pressed="false">0</button>
        <button type="button" class="chip" data-mv="1" aria-pressed="false">1</button>
        <button type="button" class="chip" data-mv="2" aria-pressed="false">2</button>
        <button type="button" class="chip" data-mv="3" aria-pressed="false">3</button>
        <button type="button" class="chip" data-mv="4" aria-pressed="false">4</button>
        <button type="button" class="chip" data-mv="5" aria-pressed="false">5</button>
        <button type="button" class="chip" data-mv="6" aria-pressed="false">6</button>
        <button type="button" class="chip" data-mv="7+" aria-pressed="false">7+</button>
      </div>
      <p class="hint" id="mv-hint" hidden></p>

      <span class="lbl sp">Colors</span>
      <div class="colors" id="colors" role="group" aria-label="Card colors">
        <button type="button" class="pip" data-color="W" aria-pressed="false" title="White">W</button>
        <button type="button" class="pip" data-color="U" aria-pressed="false" title="Blue">U</button>
        <button type="button" class="pip" data-color="B" aria-pressed="false" title="Black">B</button>
        <button type="button" class="pip" data-color="R" aria-pressed="false" title="Red">R</button>
        <button type="button" class="pip" data-color="G" aria-pressed="false" title="Green">G</button>
        <button type="button" class="pip" data-color="C" aria-pressed="false" title="Colorless">C</button>
      </div>

      <span class="lbl">Color mode</span>
      <div class="seg" id="mode-seg" role="group" aria-label="Color mode">
        <button type="button" data-mode="exact" aria-pressed="true">Exactly these</button>
        <button type="button" data-mode="includes" aria-pressed="false">Includes these</button>
        <button type="button" data-mode="within" aria-pressed="false">Within these</button>
      </div>
      <p class="hint" id="mode-hint"></p>
    </section>

    <p class="status" id="status" role="status"></p>

    <div class="stage" id="stage">
      <div class="cardframe" id="frame" aria-live="polite">
        <div class="empty" id="placeholder"><span>Tap <strong>Random card</strong> or <strong>Draw 10</strong> to draw a rare or mythic.</span></div>
        <img class="art" id="art" alt="" hidden>
      </div>
      <button type="button" class="flip" id="flip">Flip</button>
      <div class="meta" id="meta" hidden>
        <div class="name-row">
          <h2 class="name" id="name"></h2>
          <div class="mana" id="mana"></div>
        </div>
        <div class="price-row" id="ck-prices" hidden></div>
        <p class="type" id="type"></p>
        <p class="sub"><span id="rarity"></span> · <span id="set"></span></p>
        <p class="tcg-price" id="tcg-price" hidden></p>
        <div class="buylinks">
          <a class="scry" id="scry" target="_blank" rel="noopener">View on Scryfall</a>
          <a class="ckbuy" id="ck-buy" target="_blank" rel="noopener" hidden>Buy on Card Kingdom</a>
        </div>
      </div>
    </div>

    <div id="batch" hidden>
      <div class="batch-total" id="batch-total" hidden></div>
      <div class="batch-list" id="batch-list"></div>
    </div>

    <section class="history" id="history-wrap" hidden>
      <span class="lbl">Recent draws</span>
      <div class="thumbs" id="thumbs"></div>
    </section>

    <footer>
      Card data and images from <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>.
      <span id="ck-asof"></span>
    </footer>
  </div>

  <div class="drawbar">
    <div class="drawrow">
      <button type="button" class="draw" id="draw">Random card</button>
      <button type="button" class="draw draw-ten" id="draw10">Draw 10</button>
    </div>
  </div>

<script>
(function () {
  const LS_KEY = "mtg-random-rare-v2";
  const LS_OLD = "mtg-random-legend-v1";
  const PRICE_URL = "cardkingdom_prices.json";
  const MIN_GAP_MS = 150;
  const HISTORY_MAX = 20;
  const BATCH_SIZE = 10;
  const BATCH_MAX_TRIES = 18;
  const COLOR_ORDER = ["W", "U", "B", "R", "G"];
  const TYPE_ORDER = ["creature", "instant", "sorcery", "enchantment", "artifact", "planeswalker", "land", "battle"];
  const MV_ORDER = ["0", "1", "2", "3", "4", "5", "6", "7+"];
  const SUBTYPES = {
    enchantment: ["aura", "saga", "class", "shrine", "background", "room", "case"],
    artifact: ["equipment", "vehicle"]
  };
  const ALL_SUBTYPES = SUBTYPES.enchantment.concat(SUBTYPES.artifact);

  const MODE_HINTS = {
    exact: "Only cards printed as exactly these colors (the ink on the card, not commander identity).",
    includes: "Cards that have at least these colors, and may have more.",
    within: "Cards whose colors stay within this set, including fewer colors and colorless."
  };

  const state = {
    legendary: false,
    types: [],
    subtypes: [],
    creatureTypes: "",
    mvs: [],
    colors: [],
    colorless: false,
    mode: "exact",
    history: [],
    card: null,
    face: 0,
    loading: false,
    lastFetchAt: 0,
    prices: null,
    batchCards: []
  };

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const frame = $("frame");
  const art = $("art");
  const flipBtn = $("flip");
  const placeholder = $("placeholder");
  const meta = $("meta");
  const drawBtn = $("draw");
  const draw10Btn = $("draw10");

  function loadSettings() {
    try {
      let raw = localStorage.getItem(LS_KEY);
      let migrated = false;
      if (!raw) {
        raw = localStorage.getItem(LS_OLD);
        migrated = !!raw;
      }
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved.mode === "exact" || saved.mode === "includes" || saved.mode === "within") state.mode = saved.mode;
      if (Array.isArray(saved.colors)) {
        state.colors = COLOR_ORDER.filter((c) => saved.colors.includes(c));
      }
      state.colorless = !!saved.colorless && state.colors.length === 0;
      if (Array.isArray(saved.history)) state.history = saved.history.slice(0, HISTORY_MAX);
      if (!migrated) {
        state.legendary = !!saved.legendary;
        if (Array.isArray(saved.types)) state.types = TYPE_ORDER.filter((t) => saved.types.includes(t));
        if (Array.isArray(saved.subtypes)) state.subtypes = ALL_SUBTYPES.filter((s) => saved.subtypes.includes(s));
        if (typeof saved.creatureTypes === "string") state.creatureTypes = saved.creatureTypes.slice(0, 80);
        if (Array.isArray(saved.mvs)) state.mvs = MV_ORDER.filter((v) => saved.mvs.includes(v));
      }
    } catch (e) { /* ignore bad storage */ }
  }

  function saveSettings() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        legendary: state.legendary,
        types: state.types,
        subtypes: state.subtypes,
        creatureTypes: state.creatureTypes,
        mvs: state.mvs,
        colors: state.colors,
        colorless: state.colorless,
        mode: state.mode,
        history: state.history
      }));
    } catch (e) { /* private mode / quota */ }
  }

  function syncFilters() {
    $("legendary").setAttribute("aria-pressed", String(state.legendary));
    document.querySelectorAll("#types .chip").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(state.types.includes(btn.dataset.type)));
    });
    $("sub-enchantment").hidden = !state.types.includes("enchantment");
    $("sub-artifact").hidden = !state.types.includes("artifact");
    $("sub-creature").hidden = !state.types.includes("creature");
    document.querySelectorAll("[data-subtype]").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(state.subtypes.includes(btn.dataset.subtype)));
    });
    const ct = $("creature-type");
    if (ct && ct.value !== state.creatureTypes) ct.value = state.creatureTypes;
    document.querySelectorAll("#mvs .chip").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(state.mvs.includes(btn.dataset.mv)));
    });
    document.querySelectorAll("#mode-seg button").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(btn.dataset.mode === state.mode));
    });
    document.querySelectorAll("#colors .pip").forEach((btn) => {
      const c = btn.dataset.color;
      const on = c === "C" ? state.colorless : state.colors.includes(c);
      btn.setAttribute("aria-pressed", String(on));
    });
    $("mode-hint").textContent = hintText();
    const mvHint = $("mv-hint");
    const land = state.types.includes("land");
    const mvExcludesZero = state.mvs.length > 0 && !state.mvs.includes("0");
    if (land && mvExcludesZero) {
      mvHint.hidden = false;
      mvHint.textContent = "Most lands have mana value 0, so they won’t match unless you also tap 0. Double-faced cards with a land on one face can be higher.";
    } else if (land) {
      mvHint.hidden = false;
      mvHint.textContent = "Most lands have mana value 0. A double-faced land can be higher if its other face is a spell.";
    } else {
      mvHint.hidden = true;
      mvHint.textContent = "";
    }
  }

  function hintText() {
    if (state.colorless) return "Colorless only — cards with no colored mana, like many artifacts and Eldrazi. This uses the card’s colors, not commander identity.";
    if (!state.colors.length) return "No colors selected, so any color can appear. Filters use the card’s colors, not commander identity.";
    return MODE_HINTS[state.mode];
  }

  function orClause(parts) {
    if (!parts.length) return "";
    if (parts.length === 1) return " " + parts[0];
    return " (" + parts.join(" OR ") + ")";
  }

  function queryGroup(terms, op) {
    if (!terms.length) return "";
    if (terms.length === 1) return terms[0];
    return "(" + terms.join(" " + op + " ") + ")";
  }

  function parseCreatureTypes(raw) {
    return String(raw || "").split(",").map(function (part) {
      return part.trim().replace(/\s+/g, " ").replace(/[^a-z0-9 '’-]/gi, "");
    }).filter(Boolean).slice(0, 6);
  }

  function typeTerm(name) {
    const clean = String(name).trim();
    if (!clean) return "";
    return /\s/.test(clean) ? 't:"' + clean.toLowerCase() + '"' : "t:" + clean.toLowerCase();
  }

  function typeAndSubtypeClause() {
    const parts = [];
    TYPE_ORDER.forEach((typ) => {
      if (!state.types.includes(typ)) return;
      const subTerms = [];
      if (typ === "creature") {
        parseCreatureTypes(state.creatureTypes).forEach((ct) => {
          const term = typeTerm(ct);
          if (term) subTerms.push(term);
        });
      } else {
        (SUBTYPES[typ] || []).forEach((s) => {
          if (state.subtypes.includes(s)) subTerms.push("t:" + s);
        });
      }
      if (subTerms.length) parts.push("(" + ["t:" + typ, queryGroup(subTerms, "OR")].join(" ") + ")");
      else parts.push("t:" + typ);
    });
    if (!parts.length) return "";
    return " " + queryGroup(parts, "OR");
  }

  function buildQuery() {
    let q = "(r:rare OR r:mythic) -is:digital game:paper";
    if (state.legendary) q += " t:legendary";
    q += typeAndSubtypeClause();
    if (state.mvs.length) {
      q += orClause(state.mvs.map((v) => v === "7+" ? "mv>=7" : "mv=" + v));
    }
    if (state.colorless) {
      q += " c:c";
    } else if (state.colors.length) {
      const op = state.mode === "exact" ? "=" : state.mode === "includes" ? ">=" : "<=";
      q += " c" + op + state.colors.join("");
    }
    return q;
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function setStatus(text, kind) {
    statusEl.textContent = text || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function facesOf(card) {
    const faced = (card.card_faces || []).filter((f) => f && f.image_uris);
    if (faced.length) return faced;
    if (card.image_uris) {
      return [{
        name: card.name,
        mana_cost: card.mana_cost,
        type_line: card.type_line,
        image_uris: card.image_uris
      }];
    }
    return [];
  }

  function imageUrl(uris) {
    if (!uris) return "";
    return uris.png || uris.large || uris.normal || uris.border_crop || uris.small || "";
  }

  function thumbUrl(card) {
    const faces = facesOf(card);
    const uris = (faces[0] && faces[0].image_uris) || card.image_uris || {};
    return uris.small || uris.normal || imageUrl(uris);
  }

  function renderMana(cost, box) {
    box = box || $("mana");
    box.innerHTML = "";
    if (!cost) return;
    const re = /\{([^}]+)\}/g;
    let m;
    while ((m = re.exec(cost))) {
      const code = m[1].replace(/\//g, "").toUpperCase();
      const img = document.createElement("img");
      img.src = "https://svgs.scryfall.io/card-symbols/" + encodeURIComponent(code) + ".svg";
      img.alt = m[0];
      box.appendChild(img);
    }
  }

  function slimCard(card) {
    return {
      id: card.id,
      name: card.name,
      mana_cost: card.mana_cost,
      type_line: card.type_line,
      rarity: card.rarity,
      set: card.set,
      set_name: card.set_name,
      scryfall_uri: card.scryfall_uri,
      purchase_uris: card.purchase_uris,
      prices: card.prices,
      colors: card.colors,
      cmc: card.cmc,
      layout: card.layout,
      image_uris: card.image_uris,
      card_faces: (card.card_faces || []).map((f) => ({
        name: f.name,
        mana_cost: f.mana_cost,
        type_line: f.type_line,
        image_uris: f.image_uris
      }))
    };
  }

  function showPlaceholder(html) {
    art.hidden = true;
    art.removeAttribute("src");
    flipBtn.classList.remove("show");
    meta.hidden = true;
    placeholder.hidden = false;
    placeholder.innerHTML = "<span>" + html + "</span>";
    frame.classList.remove("loading");
  }

  function money(n) {
    return "$" + n.toFixed(2);
  }

  function hyphenless(id) {
    return String(id || "").replace(/-/g, "").toLowerCase();
  }

  function unpackPrices(packed) {
    if (!packed || !packed.length) return null;
    const nf = packed[0] > 0 ? packed[0] / 100 : null;
    const foil = packed.length > 1 && packed[1] > 0 ? packed[1] / 100 : null;
    if (nf == null && foil == null) return null;
    return { nonfoil: nf, foil: foil };
  }

  function lookupCk(card) {
    const data = state.prices;
    if (!data) return null;
    const ids = data.i || {};
    const names = data.n || {};
    if (card && card.id && ids[hyphenless(card.id)]) {
      const got = unpackPrices(ids[hyphenless(card.id)]);
      if (got) return Object.assign({ source: "id" }, got);
    }
    const name = card && card.name ? String(card.name).toLowerCase() : "";
    if (name && names[name]) {
      const got = unpackPrices(names[name]);
      if (got) return Object.assign({ source: "name" }, got);
    }
    return null;
  }

  async function loadPrices() {
    const asof = $("ck-asof");
    try {
      const res = await fetch(PRICE_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      state.prices = await res.json();
      const label = state.prices.as_of_label || state.prices.as_of;
      asof.textContent = label ? "CK prices as of " + label + "." : "";
    } catch (err) {
      state.prices = { i: {}, n: {} };
      asof.textContent = "CK prices unavailable.";
    }
    if (state.card && $("stage") && !$("stage").hidden) renderPrices(state.card);
    if (state.batchCards.length && $("batch") && !$("batch").hidden) renderBatchList(state.batchCards);
    if (state.history.length) renderHistory();
  }

  function fillPricesInto(card, row, tcg, buy, datasetEl) {
    row.innerHTML = "";
    row.hidden = true;
    tcg.hidden = true;
    tcg.textContent = "";
    buy.hidden = true;
    if (datasetEl && datasetEl.dataset) {
      delete datasetEl.dataset.ckNf;
      delete datasetEl.dataset.ckFoil;
      delete datasetEl.dataset.ckSource;
      delete datasetEl.dataset.tcg;
    }
    if (!card) return;

    const ck = lookupCk(card);
    if (ck && (ck.nonfoil != null || ck.foil != null)) {
      row.hidden = false;
      if (ck.nonfoil != null) {
        const amt = document.createElement("span");
        amt.className = "ck-amt";
        amt.textContent = money(ck.nonfoil);
        row.appendChild(amt);
        if (datasetEl) datasetEl.dataset.ckNf = String(ck.nonfoil);
      }
      if (ck.foil != null) {
        const foil = document.createElement("span");
        foil.className = "ck-foil";
        foil.textContent = "foil " + money(ck.foil);
        row.appendChild(foil);
        if (datasetEl) datasetEl.dataset.ckFoil = String(ck.foil);
      }
      const note = document.createElement("span");
      note.className = "ck-note";
      note.textContent = ck.source === "name" ? "CK, cheapest printing" : "Card Kingdom";
      row.appendChild(note);
      if (datasetEl) datasetEl.dataset.ckSource = ck.source;
    } else if (state.prices) {
      row.hidden = false;
      const none = document.createElement("span");
      none.className = "ck-none";
      none.textContent = "No Card Kingdom price";
      row.appendChild(none);
      if (datasetEl) datasetEl.dataset.ckSource = "none";
    }

    const usd = card.prices && card.prices.usd ? parseFloat(card.prices.usd) : NaN;
    const usdFoil = card.prices && card.prices.usd_foil ? parseFloat(card.prices.usd_foil) : NaN;
    const tcgParts = [];
    if (!isNaN(usd)) tcgParts.push(money(usd));
    if (!isNaN(usdFoil)) tcgParts.push("foil " + money(usdFoil));
    if (tcgParts.length) {
      tcg.hidden = false;
      tcg.textContent = "TCGplayer (via Scryfall) " + tcgParts.join(" · ");
      if (datasetEl && !isNaN(usd)) datasetEl.dataset.tcg = String(usd);
    }

    const purchase = (card.purchase_uris || {}).cardkingdom;
    if (purchase) {
      buy.href = purchase;
      buy.hidden = false;
    } else if (card.name) {
      buy.href = "https://www.cardkingdom.com/catalog/search?search=" + encodeURIComponent(card.name);
      buy.hidden = false;
    }
  }

  function renderPrices(card) {
    fillPricesInto(card, $("ck-prices"), $("tcg-price"), $("ck-buy"), meta);
  }

  function showCard(card, opts) {
    const options = opts || {};
    leaveBatchView();
    state.card = card;
    state.face = options.face || 0;
    const faces = facesOf(card);
    if (!faces.length) {
      showPlaceholder("This card has no image available. Try another draw.");
      return;
    }
    if (state.face >= faces.length) state.face = 0;
    const face = faces[state.face];
    placeholder.hidden = true;
    meta.hidden = false;
    $("name").textContent = face.name || card.name || "";
    $("type").textContent = face.type_line || card.type_line || "";
    renderMana(face.mana_cost || card.mana_cost || "");
    const rarity = (card.rarity || "").toLowerCase();
    const rarityEl = $("rarity");
    rarityEl.textContent = rarity ? rarity.charAt(0).toUpperCase() + rarity.slice(1) : "";
    rarityEl.className = rarity;
    $("set").textContent = (card.set_name || "") + (card.set ? " (" + String(card.set).toUpperCase() + ")" : "");
    const link = $("scry");
    link.href = card.scryfall_uri || "https://scryfall.com";
    link.hidden = !card.scryfall_uri;
    meta.dataset.mv = card.cmc == null ? "" : String(card.cmc);
    meta.dataset.colors = (card.colors || []).join("");
    meta.dataset.typeLine = card.type_line || "";
    meta.dataset.legendary = /legendary/i.test(card.type_line || "") ? "1" : "0";
    renderPrices(card);

    const url = imageUrl(face.image_uris);
    frame.classList.add("loading");
    art.hidden = false;
    art.alt = face.name || card.name || "Card image";
    if (art.src !== url) {
      art.onload = () => frame.classList.remove("loading");
      art.onerror = () => {
        frame.classList.remove("loading");
        setStatus("The card image failed to load.", "error");
      };
      art.src = url;
    } else {
      frame.classList.remove("loading");
    }

    flipBtn.classList.toggle("show", faces.length > 1);
    flipBtn.textContent = faces.length > 1
      ? "Flip to " + (faces[(state.face + 1) % faces.length].name || "other face")
      : "Flip";

    if (options.addHistory) pushHistory(card);
    renderHistory();
  }

  function pushHistory(card) {
    const slim = slimCard(card);
    state.history = state.history.filter((c) => c.id !== slim.id);
    state.history.unshift(slim);
    if (state.history.length > HISTORY_MAX) state.history.pop();
    saveSettings();
  }

  function renderHistory() {
    const wrap = $("history-wrap");
    const thumbs = $("thumbs");
    thumbs.innerHTML = "";
    if (!state.history.length) {
      wrap.hidden = true;
      return;
    }
    wrap.hidden = false;
    state.history.forEach((card) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.title = card.name;
      if (state.card && state.card.id === card.id) btn.setAttribute("aria-current", "true");
      const img = document.createElement("img");
      img.src = thumbUrl(card);
      img.alt = card.name;
      btn.appendChild(img);
      const ck = lookupCk(card);
      if (ck && ck.nonfoil != null) {
        const tag = document.createElement("span");
        tag.className = "thumb-price";
        tag.textContent = money(ck.nonfoil);
        btn.appendChild(tag);
        btn.title = card.name + " · " + money(ck.nonfoil);
      }
      btn.addEventListener("click", () => {
        setStatus("");
        showCard(card, { addHistory: false, face: 0 });
      });
      thumbs.appendChild(btn);
    });
  }

  function setBusy(on) {
    state.loading = on;
    drawBtn.disabled = on;
    draw10Btn.disabled = on;
  }

  function leaveBatchView() {
    const batch = $("batch");
    if (batch) batch.hidden = true;
    $("stage").hidden = false;
    state.batchCards = [];
  }

  function enterBatchView() {
    $("stage").hidden = true;
    $("batch").hidden = false;
  }

  function paintCardFace(card, faceIndex, img, nameEl, typeEl, manaBox, flip, frameEl) {
    const faces = facesOf(card);
    if (!faces.length) return 0;
    const i = faceIndex % faces.length;
    const face = faces[i];
    if (nameEl) nameEl.textContent = face.name || card.name || "";
    if (typeEl) typeEl.textContent = face.type_line || card.type_line || "";
    if (manaBox) renderMana(face.mana_cost || card.mana_cost || "", manaBox);
    const url = imageUrl(face.image_uris);
    if (img) {
      img.hidden = false;
      img.alt = face.name || card.name || "Card image";
      if (frameEl) frameEl.classList.add("loading");
      img.onload = () => { if (frameEl) frameEl.classList.remove("loading"); };
      img.onerror = () => { if (frameEl) frameEl.classList.remove("loading"); };
      if (img.src !== url) img.src = url;
      else if (frameEl) frameEl.classList.remove("loading");
    }
    if (flip) {
      flip.classList.toggle("show", faces.length > 1);
      flip.textContent = faces.length > 1
        ? "Flip to " + (faces[(i + 1) % faces.length].name || "other face")
        : "Flip";
    }
    return i;
  }

  function fillCardMeta(card, rarityEl, setEl, scry) {
    const rarity = (card.rarity || "").toLowerCase();
    if (rarityEl) {
      rarityEl.textContent = rarity ? rarity.charAt(0).toUpperCase() + rarity.slice(1) : "";
      rarityEl.className = rarity;
    }
    if (setEl) {
      setEl.textContent = (card.set_name || "") + (card.set ? " (" + String(card.set).toUpperCase() + ")" : "");
    }
    if (scry) {
      scry.href = card.scryfall_uri || "https://scryfall.com";
      scry.hidden = !card.scryfall_uri;
    }
  }

  function buildCardItem(card) {
    const article = document.createElement("article");
    article.className = "card-item";
    if (card.id) article.dataset.id = card.id;
    article.dataset.name = card.name || "";

    const frameEl = document.createElement("div");
    frameEl.className = "cardframe";
    const img = document.createElement("img");
    img.className = "art";
    img.alt = "";
    frameEl.appendChild(img);

    const flip = document.createElement("button");
    flip.type = "button";
    flip.className = "flip";
    flip.textContent = "Flip";

    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    const nameRow = document.createElement("div");
    nameRow.className = "name-row";
    const nameEl = document.createElement("h2");
    nameEl.className = "name";
    const manaBox = document.createElement("div");
    manaBox.className = "mana";
    nameRow.appendChild(nameEl);
    nameRow.appendChild(manaBox);
    const priceRow = document.createElement("div");
    priceRow.className = "price-row";
    const typeEl = document.createElement("p");
    typeEl.className = "type";
    const sub = document.createElement("p");
    sub.className = "sub";
    const rarityEl = document.createElement("span");
    const setEl = document.createElement("span");
    sub.appendChild(rarityEl);
    sub.appendChild(document.createTextNode(" · "));
    sub.appendChild(setEl);
    const tcg = document.createElement("p");
    tcg.className = "tcg-price";
    tcg.hidden = true;
    const links = document.createElement("div");
    links.className = "buylinks";
    const scry = document.createElement("a");
    scry.className = "scry";
    scry.target = "_blank";
    scry.rel = "noopener";
    scry.textContent = "View on Scryfall";
    const buy = document.createElement("a");
    buy.className = "ckbuy";
    buy.target = "_blank";
    buy.rel = "noopener";
    buy.textContent = "Buy on Card Kingdom";
    buy.hidden = true;
    links.appendChild(scry);
    links.appendChild(buy);
    metaEl.appendChild(nameRow);
    metaEl.appendChild(priceRow);
    metaEl.appendChild(typeEl);
    metaEl.appendChild(sub);
    metaEl.appendChild(tcg);
    metaEl.appendChild(links);

    article.appendChild(frameEl);
    article.appendChild(flip);
    article.appendChild(metaEl);

    let face = 0;
    paintCardFace(card, face, img, nameEl, typeEl, manaBox, flip, frameEl);
    fillCardMeta(card, rarityEl, setEl, scry);
    fillPricesInto(card, priceRow, tcg, buy, article);
    flip.addEventListener("click", () => {
      const faces = facesOf(card);
      if (faces.length < 2) return;
      face = (face + 1) % faces.length;
      paintCardFace(card, face, img, nameEl, typeEl, manaBox, flip, frameEl);
    });
    return article;
  }

  function batchTotalHtml(cards) {
    let total = 0, counted = 0;
    cards.forEach((c) => {
      const ck = lookupCk(c);
      if (ck && ck.nonfoil != null) {
        total += ck.nonfoil;
        counted++;
      }
    });
    const short = cards.length < BATCH_SIZE ? "Drew " + cards.length + " of " + BATCH_SIZE : "";
    if (counted) {
      let note = "CK total";
      if (counted !== cards.length) note += " for " + counted + (counted === 1 ? " card" : " cards");
      if (short) note += " · " + short;
      return '<span class="amt">' + money(total) + '</span><span class="note">' + note + "</span>";
    }
    return '<span class="note">' + (short || (cards.length + " cards")) + ". No Card Kingdom prices in this batch.</span>";
  }

  function renderBatchList(cards) {
    const list = $("batch-list");
    const tot = $("batch-total");
    list.innerHTML = "";
    cards.forEach((card) => list.appendChild(buildCardItem(card)));
    if (cards.length) {
      tot.hidden = false;
      tot.innerHTML = batchTotalHtml(cards);
    } else {
      tot.hidden = true;
      tot.innerHTML = "";
    }
  }

  async function fetchRandomCard() {
    const wait = MIN_GAP_MS - (Date.now() - state.lastFetchAt);
    if (wait > 0) await sleep(wait);
    const url = "https://api.scryfall.com/cards/random?q=" + encodeURIComponent(buildQuery());
    state.lastFetchAt = Date.now();
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (res.status === 404) return { notFound: true, status: 404 };
    if (!res.ok) return { error: true, status: res.status };
    return { card: await res.json() };
  }

  async function drawRandom() {
    if (state.loading) return;
    setBusy(true);
    leaveBatchView();
    setStatus("Drawing…");
    frame.classList.add("loading");

    try {
      const result = await fetchRandomCard();
      if (result.notFound) {
        showPlaceholder("No cards match those filters. Try a different type, mana cost, or color combo.");
        setStatus("No cards match those filters.", "empty");
        return;
      }
      if (result.error || !result.card) {
        showPlaceholder("Scryfall didn’t return a card. Wait a moment and try again.");
        setStatus("Couldn’t reach Scryfall" + (result.status ? " (" + result.status + ")." : "."), "error");
        return;
      }
      setStatus("");
      showCard(result.card, { addHistory: true });
    } catch (err) {
      showPlaceholder("Couldn’t reach Scryfall. Check your connection and try again.");
      setStatus("Network error — try again.", "error");
    } finally {
      setBusy(false);
      frame.classList.remove("loading");
    }
  }

  $("legendary").addEventListener("click", () => {
    state.legendary = !state.legendary;
    saveSettings();
    syncFilters();
  });

  document.querySelectorAll("#types .chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.type;
      if (state.types.includes(t)) state.types = state.types.filter((x) => x !== t);
      else state.types = TYPE_ORDER.filter((x) => x === t || state.types.includes(x));
      const allowed = [];
      state.types.forEach((typ) => {
        (SUBTYPES[typ] || []).forEach((s) => allowed.push(s));
      });
      state.subtypes = state.subtypes.filter((s) => allowed.includes(s));
      saveSettings();
      syncFilters();
    });
  });

  document.querySelectorAll("[data-subtype]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const s = btn.dataset.subtype;
      if (state.subtypes.includes(s)) state.subtypes = state.subtypes.filter((x) => x !== s);
      else state.subtypes = ALL_SUBTYPES.filter((x) => x === s || state.subtypes.includes(x));
      saveSettings();
      syncFilters();
    });
  });

  $("creature-type").addEventListener("input", () => {
    state.creatureTypes = $("creature-type").value.slice(0, 80);
    saveSettings();
  });

  document.querySelectorAll("#mvs .chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      const v = btn.dataset.mv;
      if (state.mvs.includes(v)) state.mvs = state.mvs.filter((x) => x !== v);
      else state.mvs = MV_ORDER.filter((x) => x === v || state.mvs.includes(x));
      saveSettings();
      syncFilters();
    });
  });

  document.querySelectorAll("#mode-seg button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.mode = btn.dataset.mode;
      saveSettings();
      syncFilters();
    });
  });

  document.querySelectorAll("#colors .pip").forEach((btn) => {
    btn.addEventListener("click", () => {
      const c = btn.dataset.color;
      if (c === "C") {
        state.colorless = !state.colorless;
        if (state.colorless) state.colors = [];
      } else {
        state.colorless = false;
        if (state.colors.includes(c)) state.colors = state.colors.filter((x) => x !== c);
        else state.colors = COLOR_ORDER.filter((x) => x === c || state.colors.includes(x));
      }
      saveSettings();
      syncFilters();
    });
  });

  flipBtn.addEventListener("click", () => {
    if (!state.card) return;
    const faces = facesOf(state.card);
    if (faces.length < 2) return;
    showCard(state.card, { addHistory: false, face: (state.face + 1) % faces.length });
  });

  async function drawBatch() {
    if (state.loading) return;
    setBusy(true);
    enterBatchView();
    $("batch-list").innerHTML = "";
    $("batch-total").hidden = true;
    $("batch-total").innerHTML = "";
    const seen = {};
    const cards = [];
    let tries = 0;
    let hitEmpty = false;

    try {
      while (cards.length < BATCH_SIZE && tries < BATCH_MAX_TRIES) {
        tries += 1;
        setStatus("Drawing " + (cards.length + 1) + "/" + BATCH_SIZE + "…");
        const result = await fetchRandomCard();
        if (result.notFound) {
          hitEmpty = true;
          break;
        }
        if (result.error || !result.card || !result.card.id) continue;
        if (seen[result.card.id]) continue;
        seen[result.card.id] = true;
        cards.push(result.card);
        $("batch-list").appendChild(buildCardItem(result.card));
        pushHistory(result.card);
      }
      renderHistory();
      state.batchCards = cards;
      if (!cards.length && hitEmpty) {
        leaveBatchView();
        showPlaceholder("No cards match those filters. Try a different type, mana cost, or color combo.");
        setStatus("No cards match those filters.", "empty");
        return;
      }
      if (!cards.length) {
        leaveBatchView();
        showPlaceholder("Scryfall didn’t return cards. Wait a moment and try again.");
        setStatus("Couldn’t reach Scryfall.", "error");
        return;
      }
      const tot = $("batch-total");
      tot.hidden = false;
      tot.innerHTML = batchTotalHtml(cards);
      if (cards.length < BATCH_SIZE) {
        setStatus("Only " + cards.length + " unique cards matched these filters.", "empty");
      } else {
        setStatus("");
      }
    } catch (err) {
      if (!cards.length) {
        leaveBatchView();
        showPlaceholder("Couldn’t reach Scryfall. Check your connection and try again.");
        setStatus("Network error — try again.", "error");
      } else {
        $("batch-total").hidden = false;
        $("batch-total").innerHTML = batchTotalHtml(cards);
        setStatus("Stopped after " + cards.length + " cards.", "error");
      }
    } finally {
      setBusy(false);
      frame.classList.remove("loading");
    }
  }

  drawBtn.addEventListener("click", () => drawRandom());
  draw10Btn.addEventListener("click", () => drawBatch());

  loadSettings();
  syncFilters();
  if (state.history.length) {
    showCard(state.history[0], { addHistory: false });
  } else {
    renderHistory();
  }
  loadPrices();
})();
</script>
</body>
</html>
